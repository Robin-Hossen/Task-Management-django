{% extends "admin/dashboard.html" %}
{% block content %}
    
    <div class="container mx-auto p-6 w-1/2">
        <ul>
            {% for message in messages %}
                <li class="text-green-600 px-1 py-1">{{ message }}</li>
            {% endfor %}
        </ul>
    <h2 class="text-2xl font-semibold mb-4">Create Group</h2>
    <form method="post" action="">
        {% csrf_token %}
        <div class="mb-4">
        <label for="group_name" class="block text-gray-700 font-medium mb-2">Group Name:</label>
        {{ form}}
        </div>
        <button
        type="submit"
        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded"
        >
        Create Group
        </button>
    </form>
    </div>
{% endblock content %}
