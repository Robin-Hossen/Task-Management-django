{% extends "base.html" %}
{% block content %}
    <div class="container mx-auto p-6 w-1/2">
        <h2 class="text-2xl font-semibold mb-4">Create an Account</h2>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}

                <p>
                    <label for="{{field.id_for_label}}">{{field.label}}</label>
                    {{field}}
                    {% if field.errors %}
                            <ul>
                                {% for error in field.errors %}
                                    <li>{{error}}</li>
                                {% endfor %}
                            </ul>
                    {% endif %}

                </p>
                
            
            {% endfor %}
            
            
                <button class="bg-blue-500 text-white px-4 py-3 mt-3 rounded" type="submit">Sign Up</button>
            
        </form>
    </div>
{% endblock content %}
