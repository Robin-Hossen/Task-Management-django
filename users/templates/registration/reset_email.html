
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#2563eb; padding:24px; text-align:center;">
              <h1 style="margin:0; color:#ffffff; font-size:24px;">
                Password Reset
              </h1>
            </td>
          </tr>

          <tr>
            <td style="padding:32px;">
              <p style="font-size:16px; color:#111827; margin:0 0 16px;">
                Hi {{ user.get_full_name|default:user.username }},
              </p>

              <p style="font-size:15px; color:#374151; line-height:1.6; margin:0 0 24px;">
                You requested a password reset for your account. Click the button below to create a new password.
              </p>

              <p style="text-align:center; margin:32px 0;">
                <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                   style="background-color:#2563eb; color:#ffffff; text-decoration:none; padding:14px 24px; border-radius:6px; display:inline-block; font-size:15px; font-weight:bold;">
                  Reset Password
                </a>
              </p>
              <p style="font-size:14px; color:#6b7280; line-height:1.6; margin:0;">
                If you did not request this password reset, you can safely ignore this email.
              </p>
            </td>
          </tr>

          <tr>
            <td style="background-color:#f9fafb; padding:20px; text-align:center;">
              <p style="font-size:13px; color:#9ca3af; margin:0;">
                Task Management Team
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
