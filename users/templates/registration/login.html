{% extends "base.html" %}
{% block content %}
    <div class="container mx-auto p-6 w-1/2">
        <h2 class="text-2xl font-semibold mb-4">Login to Your Account</h2>
       {% if messages %}
                {% for message in messages %}
                   <div class="px-2 py-1 {% if message.tags == "success" %}bg-green-500{% endif %} ">
                        {{ message }}
                    </div>
                {% endfor %}
        {% endif %}

       

        <form method="POST">
            {% csrf_token %}
                {{ form.as_p }}
            <button class="bg-blue-500 text-white px-4 py-3 mt-3 rounded" type="submit">Login</button>
        </form>
        <p class="mt-4">
            <a href="{% url 'password_reset' %}" class="text-blue-500 hover:underline">Forgot Password?</a>
        </p>
    </div>
{% endblock content %}
