{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body>
    <h1> Welcome to Login Page</h1>
    <div>
       {% if messages %}
                {% for message in messages %}
                   <div class="px-2 py-1 {% if message.tags == "success" %}bg-green-500{% endif %} ">
                        {{ message }}
                    </div>
                {% endfor %}
        {% endif %}

       

        <form action="" method="post">
            {% csrf_token %}
                {{ form.as_p }}
            <button class="bg-blue-500 text-white px-4 py-3 mt-3 rounded" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
